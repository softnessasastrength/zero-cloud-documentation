name: Metro playground
on:
  pull_request:
    paths: ['playground/**', '.github/workflows/playground.yml']
  push:
    branches: [main]
    paths: ['playground/**', '.github/workflows/playground.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:api
      - run: node simulator/pwa-smoke.mjs
      - run: python3 scripts/transit-launcher-smoke.py
      - run: node scripts/transit-real-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-transit-evidence
          path: playground/test-results/
